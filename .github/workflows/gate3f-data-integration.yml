name: gate3f-data-integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/safe_time_evrp/mpc3c/**"
      - "src/safe_time_evrp/data/**"
      - "tests/test_gate3f_validity.py"
      - "scripts/run_gate3f_diagnostic.py"
      - "scripts/download_evrp_tw_d.py"
      - "docs/research_gate_3f/**"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Download and verify public benchmarks
        run: |
          python -m safe_time_evrp.data.download
          python -m safe_time_evrp.data.verify
      - name: Download and extract EVRP-TW-D
        run: python scripts/download_evrp_tw_d.py
      - name: Gate 3F validity tests (non-optional)
        run: python -m pytest -q tests/test_gate3f_validity.py tests/test_gate3e_correctness.py
      - name: Matched diagnostic
        run: |
          test -d data/raw/evrp_tw_d
          python scripts/run_gate3f_diagnostic.py
          test -f docs/research_gate_3f/matched_summary.json
          python - <<'PY'
          import json, subprocess
          summary = json.loads(open("docs/research_gate_3f/matched_summary.json", encoding="utf-8").read())
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert summary["git_commit"] == head, (summary["git_commit"], head)
          print("git_commit ok", head)
          PY
      - name: Upload matched summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3f-matched-summary
          path: docs/research_gate_3f/matched_summary.json
          if-no-files-found: ignore
